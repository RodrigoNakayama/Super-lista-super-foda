<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login · lIsTa 26</title>
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="src/icons/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="src/icons/icon-512x512.png">
    <meta name="theme-color" content="#80AB82">
    <link rel="stylesheet" href="src/css/login.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <button id="imageBtn" class="image-btn" aria-label="Mostrar imagem aleatória">🎲</button>
            <button id="darkModeBtn" class="dark-mode-btn" aria-label="Modo escuro">🌙</button>
        </div>
        
        <div class="slots-container">
            <h3 class="slots-title">🎰 JACKPOT SLOTS 🎰</h3>
            <div class="slots-machine">
                <div class="slot-reel" id="slot1">🍒</div>
                <div class="slot-reel" id="slot2">🍒</div>
                <div class="slot-reel" id="slot3">🍒</div>
            </div>
            <button id="spinBtn" class="spin-btn">GIRAR 🎲</button>
            <div id="slotMessage" class="slot-message"></div>
        </div>
        
        <img id="logo" src="src/icons/icon-512x512.png" alt="lIsTa 26">
        <h2 class="titulo">lIsTa 26</h2>
        <p class="subtitulo">Lista de compras compartilhada</p>
        
        <input type="email" id="email" placeholder="Seu e-mail">
        <input type="password" id="senha" placeholder="Sua senha">
        
        <div class="botoes">
            <button onclick="login()">Entrar</button>
            <button onclick="cadastro()" class="secundario">Criar conta</button>
        </div>
    </div>

    <div id="floatingImage" class="floating-image hidden">
        <img id="randomImage" src="" alt="Imagem aleatória">
        <button id="closeImageBtn" class="close-image-btn">✖</button>
    </div>

    <div id="jackpotModal" class="jackpot-modal hidden">
        <div class="jackpot-content">
            <div class="jackpot-animation">💀 JACKPOT! 💀</div>
            <p>Você será desconectado em <span id="countdown">3</span> segundos...</p>
            <div class="jackpot-skull">☠️</div>
        </div>
    </div>

    <script type="module" src="auth.js"></script>
    <script src="theme.js"></script>
    <script src="slots.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Falha no ServiceWorker:', error);
                    });
            });
        }
    </script>
</body>
</html>
