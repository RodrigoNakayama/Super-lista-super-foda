<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="src/icons/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="src/css/index.css">
    <title>lIsTa 26</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <button id="imageBtn" class="image-btn" aria-label="Mostrar imagem aleatória">🎲</button>
            <h2 class="titulo">Lista super foda</h2>
            <button id="darkModeBtn" class="dark-mode-btn" aria-label="Modo escuro">🌙</button>
        </div>
        <button onclick="logout()">Sair</button>
        <ul id="lista"></ul>
        <input type="text" id="item" placeholder="Novo Item">
        <button onclick="adicionarItem()">Adicionar</button>
    </div>

    <div id="floatingImage" class="floating-image hidden">
        <img id="randomImage" src="" alt="Imagem aleatória">
        <button id="closeImageBtn" class="close-image-btn">✖</button>
    </div>

    <script type="module" src="app.js"></script>
    <script src="theme.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado com sucesso:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Falha ao registrar o ServiceWorker:', error);
                    });
            });
        }
    </script>
</body>
</html>
