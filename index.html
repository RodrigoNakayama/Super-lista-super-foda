<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="src/icons/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="src/css/index.css">
    <title>lIsTa 26</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <button id="imageBtn" class="image-btn" aria-label="Jumpscare">💀</button>
            <h2 class="titulo">Lista super foda</h2>
            <button id="darkModeBtn" class="dark-mode-btn" aria-label="Modo escuro">🌙</button>
        </div>
        
        <div class="points-system">
            <div class="points-card">
                <span class="points-icon">⭐</span>
                <span class="points-label">Seus Pontos:</span>
                <span id="pointsDisplay" class="points-value">100</span>
            </div>
            <div id="pointsMessage" class="points-message"></div>
        </div>
        
        <div class="multi-select-buttons">
            <button id="selecionarTodos" class="multi-btn">Selecionar Todos</button>
            <button id="deletarSelecionados" class="multi-btn delete-btn">🗑️ Remover Selecionados</button>
            <button id="aumentarSelecionados" class="multi-btn">➕ +1 em Selecionados</button>
            <button id="diminuirSelecionados" class="multi-btn">➖ -1 em Selecionados</button>
        </div>
        
        <div class="slots-container">
            <h3 class="slots-title">🎰 GIRE PARA GANHAR PONTOS 🎰</h3>
            <div class="slots-machine">
                <div class="slot-reel" id="slot1">🍒</div>
                <div class="slot-reel" id="slot2">🍒</div>
                <div class="slot-reel" id="slot3">🍒</div>
            </div>
            <button id="spinBtn" class="spin-btn">GIRAR 🎲 (GANHE PONTOS)</button>
            <div id="slotMessage" class="slot-message"></div>
        </div>
        
        <div class="info-box">
            <p>💡 Adicionar item: <strong>-10 pontos</strong></p>
            <p>🗑️ Remover item: <strong>-5 pontos</strong></p>
            <p>📦 Alterar quantidade: <strong>-2 pontos por item</strong></p>
            <p>🎰 Gire os slots para ganhar pontos!</p>
        </div>
        
        <button onclick="logout()">Sair</button>
        <ul id="lista"></ul>
        <input type="text" id="item" placeholder="Novo Item">
        <button onclick="adicionarItem()">Adicionar</button>
    </div>

    <div id="floatingImage" class="floating-image hidden">
        <img id="randomImage" src="" alt="Jumpscare">
    </div>

    <div id="jackpotModal" class="jackpot-modal hidden">
        <div class="jackpot-content">
            <div class="jackpot-animation">💀 JACKPOT! 💀</div>
            <p>Você será desconectado em <span id="countdown">3</span> segundos...</p>
            <div class="jackpot-skull">☠️</div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
    <script src="theme.js"></script>
    <script src="slots.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado com sucesso:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Falha ao registrar o ServiceWorker:', error);
                    });
            });
        }
    </script>
</body>
</html>
